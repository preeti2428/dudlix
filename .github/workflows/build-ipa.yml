name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA Package
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Prebuild (Generate iOS Native Project)
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          pod install

      - name: Build Unsigned iOS Archive (.xcarchive)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Doodlix.xcworkspace \
            -scheme Doodlix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/Doodlix.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::xcodebuild archive failed!"
              echo "==================== EXTRACTED ERRORS ===================="
              grep -E -C 3 "(error:|fatal error:|\*\* ARCHIVE FAILED \*\*)" xcodebuild.log || true
              echo "==================== LAST 60 LINES ===================="
              tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package App into .ipa for Sideloadly / AltStore
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -r ./build/Doodlix.xcarchive/Products/Applications/Doodlix.app Payload/
          zip -r Doodlix.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodlix-ios-ipa
          path: mobile/ios/Doodlix.ipa
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-log
          path: mobile/ios/xcodebuild.log
