name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA Package
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Prebuild (Generate iOS Native Project)
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build Unsigned iOS Archive (.app)
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace Doodlix.xcworkspace \
            -scheme Doodlix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package App into .ipa for Sideloadly / AltStore
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Doodlix.app Payload/
          zip -r Doodlix.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodlix-ios-ipa
          path: mobile/ios/Doodlix.ipa
          retention-days: 14
