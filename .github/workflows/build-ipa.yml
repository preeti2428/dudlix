name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA Package
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Prebuild (Generate iOS Native Project)
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          pod install

      - name: Build Unsigned iOS App
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Doodlix.xcworkspace \
            -scheme Doodlix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::xcodebuild failed!"
              echo "==================== EXTRACTED ERRORS ===================="
              grep -E -C 3 "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log || true
              echo "==================== LAST 60 LINES ===================="
              tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package App into .ipa for Sideloadly / AltStore
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "Doodlix.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Doodlix.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Doodlix.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodlix-ios-ipa
          path: mobile/ios/Doodlix.ipa
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-log
          path: mobile/ios/xcodebuild.log
